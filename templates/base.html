<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DocuSort{% endblock %}</title>
  <meta name="description" content="Sort PDFs, Word files, scans and photos by document type, pull out their key details and find personal numbers before you share them.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='9' width='26' height='18' rx='2' fill='%2315181B'/%3E%3Crect x='7' y='4' width='18' height='9' rx='1' fill='%23F7F8F5' stroke='%2315181B' stroke-width='2'/%3E%3Crect x='11' y='16' width='10' height='3' fill='%23D9480F'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>try { var t = localStorage.getItem('ds-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body data-page="{{ page }}">
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <div class="wrap top__in">
      <a class="mark" href="{{ url_for('sort_page') }}" aria-label="DocuSort home">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect x="3" y="9" width="26" height="18" rx="2" class="mark__tray"/><rect x="7" y="4" width="18" height="9" rx="1" class="mark__sheet"/><rect x="11" y="16" width="10" height="3" class="mark__tag"/></svg>
        <span>DocuSort</span>
      </a>
      <nav class="top__nav" aria-label="Main">
        <a href="{{ url_for('sort_page') }}" {% if page == 'sort' %}aria-current="page"{% endif %}>Sort documents</a>
        <a href="{{ url_for('accuracy_page') }}" {% if page == 'accuracy' %}aria-current="page"{% endif %}>How accurate is it?</a>
      </nav>
      <button class="iconbtn" id="theme" type="button" aria-label="Switch colour theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      </button>
    </div>
  </header>
  <main id="main">{% block content %}{% endblock %}</main>
  <footer class="foot">
    <div class="wrap foot__in">
      <p><strong>DocuSort</strong> is an open-source document sorter. It can be wrong, so check anything important yourself.</p>
      <p class="foot__links"><a href="{{ url_for('privacy_page') }}">Privacy policy</a><a href="{{ url_for('terms_page') }}">Terms and conditions</a><a href="https://github.com/binayakmandal-hash/docusort-ai">Source code</a></p>
    </div>
  </footer>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
